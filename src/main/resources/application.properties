spring.application.name=racerecall-backend
server.port=${PORT:8080}
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# Active database profile: 'sqlite' (default) or 'postgres'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:sqlite}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Shared JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db