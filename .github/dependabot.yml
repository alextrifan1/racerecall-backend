version: 2
updates:
  # Java dependencies from pom.xml
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # minor and patch updates together in ONE PR, to avoid a flood of PRs
      maven-minor-and-patch:
        update-types: [minor, patch]

  # Versions of the actions used in .github/workflows (checkout, setup-java...)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Base images from the Dockerfile (maven, eclipse-temurin)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"