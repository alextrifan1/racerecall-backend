name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On PRs, a new push cancels the old run. On main, every commit runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    name: Docker image and health check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t racerecall-backend:ci .

      - name: Start container
        run: |
          docker run -d --name app -p 8080:8080 \
            -e JWT_SECRET=ci-only-secret-that-is-at-least-32-characters-long \
            racerecall-backend:ci

      - name: Wait until the app is ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health/readiness; then
              echo
              echo "App is ready after ~$((i * 5)) seconds"
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time. Container logs:"
          docker logs app
          exit 1
  deploy:
    name: Deploy to production
    needs: [ test, docker ]
    # Only after a merge to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://racerecall-frontend.vercel.app
    # Never run two deploys at the same time, and never cancel one halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run deploy script on the VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        # The forced command in authorized_keys runs deploy-racerecall.sh;
        # its exit code (0 = ready, 1 = not ready) becomes the result of this step
        run: ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST"